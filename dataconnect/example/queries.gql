# ============================================================
# DEWLY FARM - EXAMPLE CONNECTOR
# Compatible with current User schema
# ============================================================

query GetMyUser @auth(level: USER) {
  users {
    id
    name
    email
    role
    phoneNumber
    status
    farm {
      id
      farmName
      location
      contactPhone
      email
      ownerUid
    }
    userAccesses_on_user {
      id
      dashboard
      animals
      health
      breeding
      production
      fields
      crops
      harvest
      inventory
      suppliers
      equipment
      employees
      sales
      customers
      income
      expenses
      reports
      notifications
      users
      settings
    }
  }
}

query ListMyFarmUsers @auth(level: USER) {
  users {
    id
    name
    email
    role
