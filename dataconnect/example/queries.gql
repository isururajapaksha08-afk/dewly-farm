# ============================================================
# EQUIPMENT MAINTENANCE
# ============================================================

query ListEquipmentMaintenance @auth(level: USER) {
  equipmentMaintenances(
    where: {
      equipment: {
        farm: {
          ownerUid: { eq_expr: "auth.uid" }
        }
      }
    }
  ) {
    id
    serviceDate
    description
    cost
    nextServiceDate
    technician
    notes
    equipment {
      id
      name
      equipmentType
      serialNumber
    }
  }
}