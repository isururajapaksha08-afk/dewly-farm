# ============================================================
# DASHBOARD - FARM
# ============================================================

query GetMyFarms @auth(level: USER) {
  farms(
    where: {
      ownerUid: { eq_expr: "auth.uid" }
    }
  ) {
    id
    farmName
    location
    contactPhone
    email
    ownerUid
  }
}

# ============================================================
# DASHBOARD - ANIMALS
# ============================================================

query ListMyAnimals @auth(level: USER) {
  animals(
    where: {
      farm: {
        ownerUid: { eq_expr: "auth.uid" }
      }
    }
  ) {
    id
    tagId
    species
    birthDate
    status
    breed
    gender
    purchaseDate
    farm {
      id
      farmName
    }
  }
}

