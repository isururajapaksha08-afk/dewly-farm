# ============================================================
# DEWLY FARM - DATA CONNECT DATABASE SCHEMA
# ============================================================


# ============================================================
# FARM
# ============================================================

type Farm @table {
  farmName: String!
  location: String!
  contactPhone: String
  email: String

  # Firebase Authentication UID of the farm owner
  # Keep nullable initially so existing Farm records
  # can be migrated safely.
  ownerUid: String
}


# ============================================================
# USER
# ============================================================

type User @table {
  name: String!
  email: String
  role: String!
  phoneNumber: String
  status: String! @default(value: "Active")
  farm: Farm!
}

# ============================================================
# USER ACCESS
# ============================================================

type UserAccess @table {
  user: User!

  dashboard: Boolean! @default(value: true)

  animals: Boolean! @default(value: false)
  health: Boolean! @default(value: false)
  breeding: Boolean! @default(value: false)

  production: Boolean! @default(value: false)

  fields: Boolean! @default(value: false)
  crops: Boolean! @default(value: false)
  harvest: Boolean! @default(value: false)

  inventory: Boolean! @default(value: false)
  suppliers: Boolean! @default(value: false)

  equipment: Boolean! @default(value: false)

  employees: Boolean! @default(value: false)

  sales: Boolean! @default(value: false)
  customers: Boolean! @default(value: false)

  income: Boolean! @default(value: false)
  expenses: Boolean! @default(value: false)

  reports: Boolean! @default(value: false)

  notifications: Boolean! @default(value: false)
  users: Boolean! @default(value: false)
  settings: Boolean! @default(value: false)
}


# ============================================================
# ANIMAL
# ============================================================

type Animal @table {
  tagId: String!
  species: String!
  birthDate: Date!
  status: String!
  breed: String
  gender: String
  purchaseDate: Date
  farm: Farm!
}


# ============================================================
# HEALTH RECORD
# ============================================================

type HealthRecord @table {
  eventDate: Timestamp!
  description: String!
  type: String!
  veterinarianName: String
  medicationUsed: String
  notes: String
  animal: Animal!
}


# ============================================================
# VACCINATION
# ============================================================

type Vaccination @table {
  vaccineName: String!
  dateAdministered: Date!
  nextDueDate: Date
  notes: String
  animal: Animal!
}


# ============================================================
# BREEDING
# ============================================================

type Breeding @table {
  breedingDate: Date!
  expectedBirthDate: Date
  actualBirthDate: Date
  outcome: String
  notes: String
  animal: Animal!
}


# ============================================================
# FIELD
# ============================================================

type Field @table {
  name: String!
  sizeAcres: Float!
  location: String
  soilType: String
  irrigationType: String
  currentCrop: String
  lastHarvestDate: Date
  farm: Farm!
}


# ============================================================
# CROP
# ============================================================

type Crop @table {
  name: String!
  cropType: String
  plantingDate: Date
  expectedHarvestDate: Date
  description: String
  farm: Farm!
}


# ============================================================
# HARVEST
# ============================================================

type Harvest @table {
  harvestDate: Date!
  yieldAmount: Float!
  unit: String!
  quality: String
  notes: String
  field: Field!
  crop: Crop!
}


# ============================================================
# SUPPLIER
# ============================================================

type Supplier @table {
  name: String!
  contactInfo: String
  address: String
  email: String
  farm: Farm!
}


# ============================================================
# INVENTORY ITEM
# ============================================================

type InventoryItem @table {
  itemName: String!
  category: String!
  quantityOnHand: Float!
  unit: String!
  unitPrice: Float!
  reorderLevel: Float
  expiryDate: Date
  storageLocation: String
  supplier: Supplier
  farm: Farm!
}


# ============================================================
# STOCK TRANSACTION
# ============================================================

type StockTransaction @table {
  type: String!
  quantity: Float!
  date: Date!
  unitPrice: Float
  referenceNumber: String
  notes: String
  inventoryItem: InventoryItem!
}


# ============================================================
# BEE HIVE
# ============================================================

type BeeHive @table {
  hiveNumber: String!
  location: String!
  hiveType: String
  colonyStrength: String
  queenStatus: String
  lastInspectionDate: Date
  nextInspectionDate: Date
  notes: String
  farm: Farm!
}


# ============================================================
# HONEY HARVEST
# ============================================================

type HoneyHarvest @table {
  harvestDate: Date!
  quantityKg: Float!
  quality: String
  buyer: String
  notes: String
  beeHive: BeeHive!
}


# ============================================================
# EMPLOYEE
# ============================================================

type Employee @table {
  employeeId: String!
  name: String!
  role: String!
  phone: String
  email: String
  address: String
  hireDate: Date
  salary: Float
  status: String!
  farm: Farm!
}


# ============================================================
# WORK RECORD
# ============================================================

type WorkRecord @table {
  taskDescription: String!
  date: Date!
  hours: Float
  taskType: String
  notes: String
  employee: Employee!
}


# ============================================================
# CUSTOMER
# ============================================================

type Customer @table {
  name: String!
  contactInfo: String
  address: String
  email: String
  customerType: String
  farm: Farm!
}


# ============================================================
# SALE
# ============================================================

type Sale @table {
  saleDate: Date!
  salePrice: Float!
  buyerName: String!
  paymentMethod: String
  invoiceNumber: String
  animal: Animal
  customer: Customer
  farm: Farm!
}


# ============================================================
# INCOME
# ============================================================

type Income @table {
  amount: Float!
  date: Date!
  category: String!
  description: String
  paymentMethod: String
  referenceNumber: String
  farm: Farm!
}


# ============================================================
# EXPENSE
# ============================================================

type Expense @table {
  amount: Float!
  date: Date!
  category: String!
  description: String
  paymentMethod: String
  referenceNumber: String
  farm: Farm!
}


# ============================================================
# FARM EVENT
# ============================================================

type FarmEvent @table {
  title: String!
  description: String
  eventType: String!
  eventDate: Date!
  priority: String!
  completed: Boolean!
  animal: Animal
  field: Field
  crop: Crop
  beeHive: BeeHive
  employee: Employee
  farm: Farm!
}


# ============================================================
# NOTIFICATION
# ============================================================

type Notification @table {
  title: String!
  message: String!
  notificationType: String!
  priority: String!
  eventDate: Date
  isRead: Boolean!
  createdAt: Timestamp!
  animal: Animal
  farmEvent: FarmEvent
  farm: Farm!
}


# ============================================================
# FARM TASK
# ============================================================

type FarmTask @table {
  title: String!
  description: String
  taskDate: Date!
  priority: String!
  status: String!
  employee: Employee
  animal: Animal
  field: Field
  notes: String
  farm: Farm!
}


# ============================================================
# EQUIPMENT
# ============================================================

type Equipment @table {
  name: String!
  equipmentType: String!
  serialNumber: String
  purchaseDate: Date
  purchasePrice: Float
  status: String!
  location: String
  lastServiceDate: Date
  nextServiceDate: Date
  notes: String
  farm: Farm!
}


# ============================================================
# EQUIPMENT MAINTENANCE
# ============================================================

type EquipmentMaintenance @table {
  serviceDate: Date!
  description: String!
  cost: Float
  nextServiceDate: Date
  technician: String
  notes: String
  equipment: Equipment!
}