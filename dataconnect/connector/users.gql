# ============================================================
# USERS
# ============================================================

query ListUsers @auth(level: USER) {
  users(orderBy: [{name: ASC}]) {
    id
    name
    email
    role
    phoneNumber
    status

    farm {
      id
      farmName
    }

    userAccess_on_user {
      id
      dashboard
      animals
      health
      breeding
      production
      fields
      crops
      harvest
      inventory
      suppliers
      equipment
      employees
      sales
      customers
      income
      expenses
      reports
      notifications
      users
      settings
    }
  }
}

query GetUser($id: UUID!) @auth(level: USER) {
