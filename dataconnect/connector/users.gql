# ============================================================
# DEWLY FARM - USER MANAGEMENT
# ============================================================

query ListUsers @auth(level: USER) {
  users(orderBy: [{name: ASC}]) {
    id
    name
    email
    role
    phoneNumber
    status

    farm {
      id
      farmName
    }

   userAccesses_on_user {
      id
      dashboard
      animals
      health
      breeding
      production
      fields
      crops
      harvest
      inventory
      suppliers
      equipment
      employees
      sales
      customers
      income
      expenses
      reports
      notifications
      users
      settings
    }
  }
}


query GetUser($id: UUID!) @auth(level: USER) {
  user(id: $id) {
    id
    name
    email
    role
    phoneNumber
    status

    farm {
      id
      farmName
    }

    userAccesses_on_user {
      id
      dashboard
      animals
      health
      breeding
      production
      fields
      crops
      harvest
      inventory
      suppliers
      equipment
      employees
      sales
      customers
      income
      expenses
      reports
      notifications
      users
      settings
    }
  }
}


# ============================================================
# CREATE USER
# ============================================================

mutation CreateUser(
  $name: String!
  $email: String
  $role: String!
  $phoneNumber: String
  $status: String!
  $farmId: UUID!
) @auth(level: USER) {
  user: user_insert(
    data: {
      name: $name
      email: $email
      role: $role
      phoneNumber: $phoneNumber
      status: $status
      farmId: $farmId
    }
  )
}


# ============================================================
# CREATE USER ACCESS
# ============================================================

mutation CreateUserAccess(
  $userId: UUID!
  $dashboard: Boolean!
  $animals: Boolean!
  $health: Boolean!
  $breeding: Boolean!
  $production: Boolean!
  $fields: Boolean!
  $crops: Boolean!
  $harvest: Boolean!
  $inventory: Boolean!
  $suppliers: Boolean!
  $equipment: Boolean!
  $employees: Boolean!
  $sales: Boolean!
  $customers: Boolean!
  $income: Boolean!
  $expenses: Boolean!
  $reports: Boolean!
  $notifications: Boolean!
  $users: Boolean!
  $settings: Boolean!
) @auth(level: USER) {
  userAccess: userAccess_insert(
    data: {
      userId: $userId
      dashboard: $dashboard
      animals: $animals
      health: $health
      breeding: $breeding
      production: $production
      fields: $fields
      crops: $crops
      harvest: $harvest
      inventory: $inventory
      suppliers: $suppliers
      equipment: $equipment
      employees: $employees
      sales: $sales
      customers: $customers
      income: $income
      expenses: $expenses
      reports: $reports
      notifications: $notifications
      users: $users
      settings: $settings
    }
  )
}


# ============================================================
# DELETE USER ACCESS
# ============================================================

mutation DeleteUserAccess($id: UUID!) @auth(level: USER) {
  userAccess_delete(
    key: {id: $id}
  )
}


# ============================================================
# DELETE USER
# ============================================================

mutation DeleteUser($id: UUID!) @auth(level: USER) {
  user_delete(
    key: {id: $id}
  )
}